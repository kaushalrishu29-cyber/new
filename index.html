<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>
  <link rel="stylesheet" href="design.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="registration-container">
  <div class="form-side">
    <h2>Register for your place</h2>
    <form>
      <label>Name</label>
      <input type="text" placeholder="Risu Kaushal" required>
      
      <label>Email</label>
      <input type="email" placeholder="risu@example.com" required>
      
      
      
      <label>Bringing a +1?</label>
      <select required>
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
      
      <label>Gender</label>
      <select required>
        <option>Male</option>
        <option>Female</option>
        <option>Others</option>
      </select>
  

      <label>Level</label>
      <select required>
        <option>Bachelors</option>
        <option>Masters</option>
      </select>
      
      <button type="submit" class="btn">Register Now</button>
    </form>
  </div>

  <div class="Contact Details">
  <div class="form-side">
    <h2>Contact Details</h2>
    <form>
      <label>Street</label>
      <input type="text" placeholder="XYZ, 002" required>
      
      <label>City</label>
      <input type="text" placeholder="New York" required>
      
      <label>Zip Code?</label>
      <input type="text" placeholder="10001" required>
      
      <label>Country</label>
            <input type="text" placeholder=",.eg nepal" required>

     
    
      
      <button type="submit" class="btn">Register Now</button>
    </form>
  </div>


  <div class="poster-side">
    <h2>Join Our NEXT Event!!!</h2>
    <p>Please fill up this form for event registration.</p>
  </div>
</div>
<div> 
  <iframe src="/resources/Gaigot.mp4"frameborder="0"></iframe>
  </div>
<div>
  <video control autoplay>
    <source src=""/>
  </video>
</div>
<div>
        <textarea rows="5" cols="60" placeholder="message"> </textarea>
      </div>

     
</body>
</html>
